<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App | Demo 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- weather card -->
    <div id="weather-card">
      <h1>Weather App</h1>

      <!-- form -->
      <form onsubmit="chkweather(event)">
        <!-- input -->
        <input type="text" placeholder="Enter city name!" />
        <!-- button -->
        <button type="submit">Check Weather</button>
      </form>

      <!-- weather list -->
      <ul></ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
